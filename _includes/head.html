{% include base_path %}
<meta charset="utf-8">
{% include seo.html %}
<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
{% if page.stylesheets %}
  {% for stylesheet in page.stylesheets %}
    <link rel="stylesheet" href="{{ stylesheet | prepend: base_path }}">
  {% endfor %}
{% endif %}
<meta http-equiv="cleartype" content="on">
<style>
.page__footer-follow {
    display: none !important;
}
.page__footer-copyright {
    display: none !important;
}
.page__footer {
    display: none !important;
    padding: 0 !important;
    margin: 0 !important;
}

/* ===== Blog（archive 布局）侧边栏去掉滚动条 ===== */
/* 关键：Minimal Mistakes 的 body class 是 layout--archive（双连字符） */
.layout--archive .page__sidebar,
.layout--archive .page__sidebar-wrap,
.layout--archive .sidebar,
.layout--archive .sidebar__inner,
.layout--archive #main,
.layout--archive .page__inner-wrap,
.layout--archive .archive {
    position: static !important;
    overflow: visible !important;
    overflow-y: visible !important;
    max-height: none !important;
    height: auto !important;
}

/* 兼容单连字符写法，双保险 */
.layout-archive .page__sidebar,
.layout-archive .page__sidebar-wrap,
.layout-archive .sidebar,
.layout-archive .sidebar__inner,
.layout-archive #main,
.layout-archive .page__inner-wrap,
.layout-archive .archive {
    position: static !important;
    overflow: visible !important;
    overflow-y: visible !important;
    max-height: none !important;
    height: auto !important;
}

.layout--archive #main,
.layout-archive #main {
    align-items: flex-start !important;
}

/* 全局：侧边栏内部不滚动、自然撑开 */
.sidebar__inner,
.page__sidebar-wrap,
.page__sidebar {
    overflow: visible !important;
    overflow-y: visible !important;
    max-height: none !important;
    height: auto !important;
}

/* 隐藏滚动条（webkit + firefox + ie） */
.sidebar__inner::-webkit-scrollbar,
.page__sidebar-wrap::-webkit-scrollbar,
.page__sidebar::-webkit-scrollbar,
#main::-webkit-scrollbar,
.page__inner-wrap::-webkit-scrollbar {
    display: none !important;
}
.sidebar__inner,
.page__sidebar-wrap,
.page__sidebar,
#main,
.page__inner-wrap {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}
</style>
